[project]
name = "devicenet-py"
version = "0.0.1"
description = "A library to interact with DeviceNet over CanBus."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "bitstring>=4.4",
  "pyserial>=3.5",
  "python-can>=4.6.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.5",
  "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
# lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",  # Trailing commas added by formatter
  "D203",    # No blank line before class (D211 preferred by Google)
  "D213",    # No summary line on second line (D212 preferred by Google)
  "EM101",   # Exception must not use a string literal, assign to variable first
  "EM102",   # Exception must not use an f-string literal, assign to variable first
  "FIX002",  # Using TODOs as context for future work
  "PLR2004", # Magic value used in comparison
  "TRY003",  # Avoid specifying long messages outside the exception class
  # 'G004',    # Logging statement uses f-string
  #     'PD901',   # Avoid using the generic variable name `df` for DataFrames
  # 'D100',    # Missing docstring in public module
  #     'D104',    # Missing docstring in public package
  #     'D107',    # Missing docstring in `__init__`
  #     'D400',    # First line should end with a period'
  #     'D401',    # First line of docstring should be in imperative mood'
]
lint.per-file-ignores."tests/*.py" = [
  "ANN",     # Typechecking
  "D101",    # Missing docstring in public class
  "D102",    # Missing docstring in public method
  "D103",    # Missing docstring in public function
  "D106",    # Missing docstring in public nested class
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "PLR2004", # Magic values
  "PT011",   # pytest.raises too broad
  "S101",    # Use of `assert` detected
  "SLF001",  # Private member accessed
]
